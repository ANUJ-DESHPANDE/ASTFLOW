# One-off: publish the official run's AppsRetrieval document vectors with the submission release, then check that
# `astflow snippets` on a fresh cache uses them (no 4-hour re-embedding) and answers an official test query.
name: apps-vectors
on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-goodall-tof53x]
    paths: [".github/workflows/apps-vectors.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -c requirements.lock.txt -e ".[dev,semantic,benchmark]"
      - uses: actions/download-artifact@v4
        with: { pattern: "gte-[0-9]*", path: shards, run-id: 36237821741, github-token: "${{ github.token }}" }
      - name: Assemble and verify
        run: python scripts/build_apps_vectors.py --shards shards --output apps-corpus-vectors-gte-modernbert-base.npz
      - name: Attach to release v1.0-submission (the official result file is not touched)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view v1.0-submission --json assets --jq '.assets[].name' | tee before.txt
          grep -qx apps-corpus-vectors-gte-modernbert-base.npz before.txt || gh release upload v1.0-submission apps-corpus-vectors-gte-modernbert-base.npz
          sha256sum apps-corpus-vectors-gte-modernbert-base.npz
      - name: astflow snippets from an empty cache (downloads the vectors from the release)
        env: { ASTFLOW_CACHE: "${{ runner.temp }}/fresh-cache" }
        run: |
          mkdir -p "$ASTFLOW_CACHE" && cp -r .astflow/models "$ASTFLOW_CACHE/models"
          python - <<'PY'
          import json, subprocess, sys, time
          from benchmark.e005_screen import load_dataset_split
          corpus, queries, qrels = load_dataset_split("test")
          qid = sorted(qrels)[0]
          open("query.txt", "w", encoding="utf-8").write(queries[qid])
          started = time.perf_counter()
          out = subprocess.run([sys.executable, "-m", "backend.app.cli", "snippets", "--query-file", "query.txt", "--json", "--top-k", "10"],
                               capture_output=True, text=True)
          print(out.stderr[-2000:])
          found = json.loads(out.stdout)
          ids = [r["id"] for r in found["results"]]
          print(json.dumps({"query_id": qid, "relevant": sorted(qrels[qid]), "top10": ids, "mode": found["mode"],
                            "embedding_cache": found["index"]["embedding_cache"], "wall_s": round(time.perf_counter() - started, 1),
                            "search_latency_ms": found["latency_ms"]}, indent=1))
          assert found["index"]["embedding_cache"]["computed"] == 0 and found["mode"] == "dense"
          PY
