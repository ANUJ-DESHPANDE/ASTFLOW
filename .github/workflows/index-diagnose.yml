# Why does indexing through the running server take far longer than `astflow index`? Isolate threads vs TS enrichment.
name: index-diagnose
on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-goodall-tof53x]
    paths: [".github/workflows/index-diagnose.yml"]

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        case: [torch-threads, api-no-enrich, cli-enrich]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: python -m pip install -c requirements.lock.txt -e ".[dev,semantic]"
      - if: matrix.case == 'torch-threads'
        run: |
          python - <<'PY'
          import time, threading, torch
          torch.set_num_threads(min(4, torch.get_num_threads()))
          a = torch.randn(2048, 2048)
          def bench(tag):
              t = time.perf_counter()
              for _ in range(20): a @ a
              print(tag, "get_num_threads", torch.get_num_threads(), f"{time.perf_counter() - t:.2f}s", flush=True)
          bench("main")
          th = threading.Thread(target=bench, args=("worker",)); th.start(); th.join()
          from concurrent.futures import ThreadPoolExecutor
          ThreadPoolExecutor(1).submit(bench, "pool").result()
          PY
      - if: matrix.case != 'torch-threads'
        run: |
          npm ci > /dev/null && python -m backend.app.cli model-download > /dev/null
          git clone -q https://github.com/expressjs/express "$RUNNER_TEMP/express"
      - if: matrix.case == 'api-no-enrich'
        env: { ASTFLOW_TS_ENRICH: "false" }
        run: |
          npm run build > /dev/null
          python -m backend.app.cli serve > serve.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 2; done
          start=$(date +%s)
          curl -s -X POST http://127.0.0.1:8000/api/index -H 'content-type: application/json' \
            -d "{\"repo_path\":\"$RUNNER_TEMP/express\",\"version\":\"4.18.2\",\"background\":false}" | python -c "import json,sys;m=json.load(sys.stdin)['manifest'];print(m['chunk_count'],m['embedding_cache'],m['enrichment']['status'])"
          echo "api index 4.18.2 (no TS enrichment): $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: matrix.case == 'cli-enrich'
        run: |
          start=$(date +%s)
          python -m backend.app.cli index "$RUNNER_TEMP/express" --version 4.18.2 | python -c "import json,sys;m=json.load(sys.stdin);print(m['chunk_count'],m['embedding_cache'],m['enrichment'])"
          echo "cli index 4.18.2 (TS enrichment on): $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
