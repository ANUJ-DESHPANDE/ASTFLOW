# Publishes the AppsRetrieval submission release (authorised by the owner on 2026-09-26). Runs once, on main, when this
# file lands there; refuses to publish unless the attached file is the frozen official result.
name: release-submission
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-submission.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the attached file is the frozen official result
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('benchmark/results/mteb-final-gte/appsretrieval_results.json'))
          m = json.load(open('benchmark/results/mteb-final-gte/run_metadata.json'))
          s = r['scores']['test'][0]
          assert r['task_name'] == 'AppsRetrieval', r['task_name']
          assert abs(s['ndcg_at_10'] - 0.5511) < 1e-4 and abs(s['mrr_at_10'] - 0.505268) < 1e-6, s
          assert m['git_commit'].startswith('036060e') and m['git_dirty_files'] == [], (m['git_commit'], m['git_dirty_files'])
          assert m['query_count'] == 3765 and m['corpus_count'] == 8765
          print('verified', s['ndcg_at_10'], s['mrr_at_10'])
          PY
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create v1.0-submission benchmark/results/mteb-final-gte/appsretrieval_results.json \
            --target "$GITHUB_SHA" \
            --title "AppsRetrieval submission: gte-modernbert-base Dense (NDCG@10 0.5511, MRR@10 0.5053)" \
            --notes "Official MTEB 2.21.0 AppsRetrieval evaluation (CoIR Apps test split, all 3,765 queries x 8,765 documents).

          - NDCG@10: 0.5511
          - MRR@10: 0.5053
          - Recall@10 / @50 / @100: 0.6967 / 0.8483 / 0.8943

          Configuration (frozen): Alibaba-NLP/gte-modernbert-base, dense retrieval, 512-token cap, CPU only.
          Evaluated code: commit 036060e. How to reproduce: README, section \"Frozen submission configuration\".
          Selection and experiment history: benchmark/EXPERIMENTS.md."
