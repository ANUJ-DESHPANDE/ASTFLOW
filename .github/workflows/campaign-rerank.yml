# E011 (campaign): cross-encoder reranking of the frozen dense candidates. Stage is set below and runs on push of this
# file: preflight first; scoring is sharded so no job approaches the 45-minute limit. Candidates: campaign run artifact.
name: campaign-rerank
on:
  push:
    branches: [claude/vibrant-goodall-tof53x]
    paths: [".github/workflows/campaign-rerank.yml"]

permissions:
  contents: write
  actions: read

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  STAGE: preflight
  DEPTH: "20"
  MAX_LENGTH: "1024"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -c requirements.lock.txt -e ".[dev,semantic,benchmark]" > /dev/null
      - uses: actions/download-artifact@v4
        with: { name: campaign-candidates, path: cand, run-id: 36318134381, github-token: "${{ github.token }}" }
      - run: lscpu | sed -n 's/^Model name: *//p'
      - if: env.STAGE == 'preflight'
        run: python benchmark/campaign_rerank.py preflight --candidates cand/candidates.json
