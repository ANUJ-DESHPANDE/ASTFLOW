[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astflow"
version = "0.1.0"
description = "Source-backed, version-aware JavaScript investigation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "networkx>=3.3,<4", "rank-bm25>=0.2.2,<0.3", "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2", "scipy>=1.14,<2", "typer>=0.12,<1"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4,<6"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
# pytrec-eval-terrier and ir-measures are the independent evaluators used by benchmark/trust (verify_retrieval).
benchmark = ["datasets>=5.0.1,<6", "pytrec-eval-terrier==0.5.10", "ir-measures==0.4.3"]
# `astflow snippets -c apps` downloads the public CoIR Apps corpus.
apps = ["datasets>=5.0.1,<6"]

[project.scripts]
astflow = "backend.app.cli:cli"

[tool.setuptools.packages.find]
include = ["backend*", "benchmark*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
